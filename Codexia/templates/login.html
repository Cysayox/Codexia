{% extends "base.html" %}

{% block title %}Connexion - Codexia{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin-top: 50px;">
    <h2 style="color: #6a0dad;">Se connecter à Codexia</h2>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="background: #ffcccc; color: #cc0000; padding: 10px; border-radius: 4px; margin-bottom: 20px;">
            {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" style="margin-top: 20px;">
        <input type="email" name="email" placeholder="Adresse Email" required 
               style="width: 80%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;"><br>
               
        <input type="password" name="password" placeholder="Mot de passe" required 
               style="width: 80%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;"><br>
               
        <button type="submit" style="background: #6a0dad; color: white; padding: 12px 25px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">Connexion</button>
    </form>
    
    <p style="margin-top: 25px;">
        <a href="/inscription" style="color: #6a0dad; text-decoration: none; font-weight: bold;">Pas encore de compte ? Créer un compte</a>
    </p>
</div>
{% endblock %}
